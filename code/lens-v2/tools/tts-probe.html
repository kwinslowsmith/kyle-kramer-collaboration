<!doctype html>
<html><head><meta charset="utf-8"><title>Lens TTS Probe</title>
<style>body{font:16px system-ui;margin:24px;max-width:760px}
button{font-size:20px;margin-right:8px}
tr td{padding:4px 10px;border-bottom:1px solid #eee}
.ok{color:#0a0}.bad{color:#c00}.warn{color:#b70}
pre{background:#f5f5f5;padding:10px;white-space:pre-wrap}</style></head>
<body>
<h1>Lens TTS Probe</h1>
<p>Loads the real <code>public/js/tts.js</code> and tries to speak one word per language, exactly like a 🔊 button.</p>
<div id="voices"></div>
<h2>Speak tests (click each — browsers require a user gesture)</h2>
<table id="tbl"></table>
<h2>All installed voices</h2>
<pre id="dump"></pre>
<script type="module">
import { speak, pickVoice } from "../public/js/tts.js";

const LANG = {
  en: { name: "English",  tts: "en-US", word: "hello" },
  ko: { name: "한국어",    tts: "ko-KR", word: "안녕하세요" },
  ja: { name: "日本語",    tts: "ja-JP", word: "こんにちは" },
  es: { name: "Español",  tts: "es-ES", word: "hola" },
  fr: { name: "Français", tts: "fr-FR", word: "bonjour" },
  zh: { name: "中文",      tts: "zh-CN", word: "你好" },
  eu: { name: "Euskara",  tts: "eu-ES", word: "kaixo" },
};

function refresh() {
  const vs = window.speechSynthesis.getVoices() || [];
  document.getElementById("dump").textContent =
    vs.map(v => `${v.lang}  ${v.name}${v.localService ? " [local]" : " [remote]"}${v.default ? " *default" : ""}`).join("\n")
    || "(getVoices() returned nothing yet)";

  const tbl = document.getElementById("tbl");
  tbl.innerHTML = "<tr><th>lang</th><th>picked voice</th><th>word</th><th>speak</th></tr>";
  for (const [code, L] of Object.entries(LANG)) {
    const v = pickVoice(L.tts);
    const cls = v ? (norm(v) === L.tts.toLowerCase() ? "ok" : "warn") : "bad";
    const label = v ? `${v.lang} · ${v.name}` : "❌ NONE — engine fallback (likely wrong-lang or silent)";
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><b>${code}</b> ${L.name}</td>
      <td class="${cls}">${label}</td>
      <td style="font-size:22px">${L.word}</td>
      <td><button>🔊</button></td>`;
    tr.querySelector("button").onclick = () => {
      console.log(`[probe] speak ${code} "${L.word}" -> ${L.tts}, voice=${v ? v.name : "NONE"}`);
      speak(L.word, L.tts);
    };
    tbl.appendChild(tr);
  }
}
const norm = (v) => (v.lang || "").toLowerCase().replace("_", "-");
window.speechSynthesis.getVoices();
window.speechSynthesis.addEventListener?.("voiceschanged", refresh);
setTimeout(refresh, 300);
refresh();
</script>
</body></html>
